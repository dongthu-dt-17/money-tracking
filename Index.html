<!DOCTYPE html>
<html lang="vi">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
  :root {
    color-scheme: light;
    --bg: #f4f3f0; --surface: #fcfcfb; --surface-2: #eeede9; --line: #e2e1dc;
    --text: #0b0b0b; --text-2: #52514e; --muted: #8a8984;
    --accent: #2a78d6; --accent-soft: #e3eefb; --on-accent: #fff;
    --pos: #1c7a2e; --danger: #c73a39; --series-1: #2a78d6; --other: #b5b4ae;
    --radius: 14px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --bg: #111110; --surface: #1a1a19; --surface-2: #262624; --line: #33332f;
      --text: #ffffff; --text-2: #c3c2b7; --muted: #8f8e86;
      --accent: #3987e5; --accent-soft: #1d2e44; --on-accent: #fff;
      --pos: #4cbb63; --danger: #e66767; --series-1: #3987e5; --other: #5c5b56;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body {
    font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: 0 16px calc(84px + env(safe-area-inset-bottom));
    max-width: 560px; margin: 0 auto;
  }
  button, input, select { font: inherit; color: inherit; }
  button { cursor: pointer; }
  .num { font-variant-numeric: tabular-nums; }

  /* Header */
  header { padding: 16px 0 12px; display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; }
  header .label { font-size: 12px; color: var(--text-2); text-transform: uppercase; letter-spacing: .04em; }
  header .balance { font-size: 26px; font-weight: 700; }
  header .spent { text-align: right; font-size: 13px; color: var(--text-2); }
  header .spent b { display: block; color: var(--text); font-size: 16px; }

  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; }
  .view { display: none; }
  .view.active { display: block; }
  h3 { font-size: 13px; color: var(--text-2); text-transform: uppercase; letter-spacing: .04em; margin: 22px 2px 8px; display: flex; justify-content: space-between; }

  /* Amount entry */
  .amount-row { display: flex; align-items: center; gap: 8px; }
  .sign { flex: none; width: 48px; height: 48px; border-radius: 12px; border: 0; font-size: 26px; font-weight: 600; background: var(--surface-2); }
  .sign.plus { background: var(--accent-soft); color: var(--pos); }
  .amount { flex: 1; min-width: 0; border: 0; background: transparent; font-size: 32px; font-weight: 700; text-align: right; outline: none; padding: 4px 0; }
  .unit { color: var(--muted); font-size: 18px; }
  .k000 { flex: none; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 8px 10px; font-weight: 600; }
  .hint { font-size: 12px; color: var(--muted); margin: 2px 0 12px 56px; }

  .cats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 12px; }
  .chip { border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 10px 6px; text-align: center; font-size: 13px; line-height: 1.2; min-height: 64px; }
  .chip .ic { display: block; font-size: 20px; margin-bottom: 4px; }
  .chip.on { border-color: var(--accent); background: var(--accent-soft); font-weight: 600; }

  .field { width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 12px; margin-bottom: 10px; outline: none; }
  .field:focus { border-color: var(--accent); }
  select.field { appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%); background-position: calc(100% - 18px) 50%, calc(100% - 13px) 50%; background-size: 5px 5px; background-repeat: no-repeat; }
  .primary { width: 100%; border: 0; border-radius: 12px; padding: 14px; background: var(--accent); color: var(--on-accent); font-weight: 600; font-size: 16px; }
  .primary:disabled { opacity: .6; }

  /* Lists */
  .day { font-size: 12px; color: var(--muted); margin: 12px 4px 4px; }
  .item { display: flex; align-items: center; gap: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 10px 10px 12px; margin-bottom: 6px; }
  .item .ic { font-size: 20px; width: 28px; text-align: center; flex: none; }
  .item .main { flex: 1; min-width: 0; }
  .item .t { font-weight: 500; }
  .item .s { font-size: 12px; color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item .amt { font-weight: 600; white-space: nowrap; }
  .item .amt.pos { color: var(--pos); }
  .del { flex: none; border: 0; background: transparent; color: var(--muted); font-size: 18px; padding: 6px 8px; border-radius: 8px; min-width: 36px; }
  .del.armed { background: var(--danger); color: #fff; font-size: 12px; font-weight: 600; }
  .empty { color: var(--muted); text-align: center; padding: 20px; font-size: 14px; }

  /* Summary */
  .month-nav { display: flex; align-items: center; justify-content: space-between; margin: 16px 0 12px; }
  .month-nav button { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; width: 40px; height: 40px; font-size: 18px; }
  .month-nav b { font-size: 17px; }
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .stat { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
  .stat .k { font-size: 12px; color: var(--text-2); }
  .stat .v { font-size: 17px; font-weight: 700; }
  .stat.hero { grid-column: 1 / -1; }
  .stat.hero .v { font-size: 24px; }
  .seg { display: inline-flex; background: var(--surface-2); border-radius: 10px; padding: 3px; }
  .seg button { border: 0; background: transparent; padding: 6px 14px; border-radius: 8px; font-size: 13px; }
  .seg button.on { background: var(--surface); font-weight: 600; box-shadow: 0 1px 2px rgba(0,0,0,.12); }
  .chart-head { display: flex; justify-content: space-between; align-items: center; margin: 22px 2px 10px; }
  .chart-head h3 { margin: 0; }

  .donut { position: relative; width: 220px; height: 220px; margin: 4px auto 16px; }
  .donut svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .donut circle.s { cursor: pointer; transition: stroke-width .15s; }
  .donut circle.s.hl { stroke-width: 7.5; }
  .donut-center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; pointer-events: none; padding: 0 44px; }
  .donut-center .k { font-size: 12px; color: var(--text-2); }
  .donut-center .v { font-size: 18px; font-weight: 700; }
  .legend .row { display: flex; align-items: center; gap: 10px; padding: 9px 4px; border-bottom: 1px solid var(--line); }
  .legend .row:last-child { border-bottom: 0; }
  .legend .row.hl { background: var(--accent-soft); border-radius: 8px; }
  .sw { width: 10px; height: 10px; border-radius: 3px; flex: none; }
  .legend .n { flex: 1; }
  .legend .p { color: var(--text-2); font-size: 13px; width: 44px; text-align: right; }
  .legend .a { font-weight: 600; min-width: 96px; text-align: right; }

  .bars .row { padding: 8px 2px; }
  .bars .top { display: flex; justify-content: space-between; font-size: 14px; margin-bottom: 5px; }
  .bars .top .a { font-weight: 600; }
  .bars .top .p { color: var(--text-2); font-size: 12px; margin-left: 6px; font-weight: 400; }
  .bars .track { height: 10px; }
  .bars .bar { height: 10px; background: var(--series-1); border-radius: 0 4px 4px 0; min-width: 3px; }
  .note { font-size: 12px; color: var(--muted); margin: 10px 2px 0; }

  /* Assets */
  .asset { display: flex; justify-content: space-between; align-items: center; padding: 12px 4px; border-bottom: 1px solid var(--line); }
  .asset:last-child { border-bottom: 0; }
  .asset .ch { font-size: 12px; color: var(--text-2); }
  .asset .b { font-weight: 700; font-size: 16px; text-align: right; }

  /* Bottom nav */
  nav { position: fixed; left: 0; right: 0; bottom: 0; background: var(--surface); border-top: 1px solid var(--line); display: flex; justify-content: center; padding-bottom: env(safe-area-inset-bottom); z-index: 5; }
  nav .in { display: flex; width: 100%; max-width: 560px; }
  nav button { flex: 1; border: 0; background: transparent; padding: 8px 0 10px; font-size: 11px; color: var(--muted); }
  nav button .ic { display: block; font-size: 22px; margin-bottom: 2px; filter: grayscale(1); opacity: .6; }
  nav button.on { color: var(--accent); font-weight: 600; }
  nav button.on .ic { filter: none; opacity: 1; }

  .toast { position: fixed; left: 50%; bottom: calc(92px + env(safe-area-inset-bottom)); transform: translateX(-50%) translateY(20px); background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: 14px; opacity: 0; pointer-events: none; transition: all .2s; z-index: 10; max-width: calc(100% - 32px); }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast.err { background: var(--danger); color: #fff; }
  .hidden { display: none !important; }
</style>
</head>
<body>

<header>
  <div>
    <div class="label" id="h-month"></div>
    <div class="balance num" id="h-balance"></div>
  </div>
  <div class="spent">Đã chi tháng này<b class="num" id="h-spent"></b></div>
</header>

<!-- 1. Chi tiêu -->
<section class="view active" id="v-expense">
  <div class="card">
    <div class="amount-row">
      <button class="sign" data-form="expense" aria-label="Đổi dấu"></button>
      <input class="amount num" id="e-amount" inputmode="numeric" placeholder="0" autocomplete="off">
      <span class="unit">₫</span>
      <button class="k000" data-target="e-amount">000</button>
    </div>
    <div class="hint" id="e-hint"></div>
    <div class="cats" id="e-cats"></div>
    <input class="field" id="e-note" placeholder="Ghi chú (không bắt buộc)" autocomplete="off">
    <button class="primary" id="e-save">Lưu khoản chi</button>
  </div>
  <h3><span>Tháng này</span><span class="num" id="e-count"></span></h3>
  <div id="e-list"></div>
</section>

<!-- 2. Tiền lưu động -->
<section class="view" id="v-transfer">
  <div class="card">
    <div class="amount-row">
      <button class="sign" data-form="transfer" aria-label="Đổi dấu"></button>
      <input class="amount num" id="t-amount" inputmode="numeric" placeholder="0" autocomplete="off">
      <span class="unit">₫</span>
      <button class="k000" data-target="t-amount">000</button>
    </div>
    <div class="hint" id="t-hint"></div>
    <select class="field" id="t-source"></select>
    <input class="field hidden" id="t-source-note" placeholder="Ghi chú nguồn (bắt buộc)" autocomplete="off">
    <input class="field" id="t-note" placeholder="Ghi chú (không bắt buộc)" autocomplete="off">
    <button class="primary" id="t-save">Lưu tiền lưu động</button>
  </div>
  <h3><span>Tháng này</span><span class="num" id="t-total"></span></h3>
  <div id="t-list"></div>
</section>

<!-- 3. Tổng hợp -->
<section class="view" id="v-summary">
  <div class="month-nav">
    <button data-shift="-1" aria-label="Tháng trước">‹</button>
    <b id="s-month"></b>
    <button data-shift="1" aria-label="Tháng sau">›</button>
  </div>
  <div class="stats" id="s-stats"></div>
  <div class="chart-head">
    <h3>Chi theo danh mục</h3>
    <div class="seg" id="s-mode">
      <button data-mode="pie">Tròn</button>
      <button data-mode="bar">Cột</button>
    </div>
  </div>
  <div class="card" id="s-chart"></div>
</section>

<!-- 4. Tài sản -->
<section class="view" id="v-assets">
  <h3><span>Số dư tài sản</span><span id="a-month"></span></h3>
  <div class="card" id="a-list"></div>
  <p class="note">Số dư = số dư ban đầu (sheet “Tài sản”) − tiền đã rút vào ví + tiền đã chuyển vào nguồn đó. Thêm / sửa tài sản trực tiếp trên sheet “Tài sản”.</p>
</section>

<nav><div class="in">
  <button data-view="expense" class="on"><span class="ic">✏️</span>Chi tiêu</button>
  <button data-view="transfer"><span class="ic">🔁</span>Lưu động</button>
  <button data-view="summary"><span class="ic">📊</span>Tổng hợp</button>
  <button data-view="assets"><span class="ic">🏦</span>Tài sản</button>
</div></nav>

<div class="toast" id="toast"></div>

<script>
const BOOT = <?!= boot ?>;

// ───── State ─────
const S = {
  config: BOOT.config,
  data: BOOT.data,                       // tháng hiện tại (header, danh sách nhập)
  sum: BOOT.data,                        // tháng đang xem ở tab Tổng hợp
  sign: { expense: BOOT.config.defaultSign, transfer: 1 },
  category: null,
  chart: readPref('chart') || 'pie',
  hl: null,
};

const SIGN_HINTS = {
  expense: { '-1': 'Khoản chi', '1': 'Khoản thu / hoàn tiền' },
  transfer: { '1': 'Tiền vào ví (rút từ nguồn)', '-1': 'Tiền ra khỏi ví (chuyển vào nguồn)' },
};
// Bậc màu cho nền tối, cùng tông với màu nhập trong sheet “Danh mục”.
const DARK_STEPS = { '#2a78d6': '#3987e5', '#eb6834': '#d95926', '#1baf7a': '#199e70', '#eda100': '#c98500', '#e87ba4': '#d55181', '#4a3aa7': '#9085e9', '#e34948': '#e66767', '#8a8984': '#76756f' };
const isDark = () => matchMedia('(prefers-color-scheme: dark)').matches;

// ───── Helpers ─────
const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt = n => new Intl.NumberFormat('vi-VN').format(Math.round(Math.abs(n)));
const money = (n, signed) => (n < 0 ? '−' : signed && n > 0 ? '+' : '') + fmt(n) + ' ₫';
const monthLabel = m => 'Tháng ' + m.slice(5) + '/' + m.slice(0, 4);
const shiftMonth = (m, d) => { const dt = new Date(+m.slice(0, 4), +m.slice(5) - 1 + d, 1); return dt.getFullYear() + '-' + String(dt.getMonth() + 1).padStart(2, '0'); };
const readAmount = el => Number(el.value.replace(/\D/g, '')) || 0;
const catOf = name => S.config.categories.find(c => c.name === name) || { name, icon: '•', color: '' };
function colorOf(hex) {
  const h = String(hex || '').toLowerCase();
  if (!/^#[0-9a-f]{6}$/.test(h)) return 'var(--other)';
  return isDark() ? (DARK_STEPS[h] || h) : h;
}
function readPref(k) { try { return localStorage.getItem('sct.' + k); } catch (e) { return null; } }
function writePref(k, v) { try { localStorage.setItem('sct.' + k, v); } catch (e) {} }

function api(fn, ...args) {
  return new Promise((resolve, reject) => {
    google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[fn](...args);
  });
}

let toastTimer;
function toast(msg, err) {
  const t = $('#toast');
  t.textContent = msg;
  t.className = 'toast show' + (err ? ' err' : '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.className = 'toast' + (err ? ' err' : ''); }, 2400);
}

/** Gọi server khi bấm nút: khoá nút, cập nhật state; trả về null nếu lỗi. */
async function run(btn, busyText, fn, ...args) {
  const label = btn.textContent;
  btn.disabled = true;
  if (busyText) btn.textContent = busyText;
  try {
    const res = await api(fn, ...args);
    applyAppData(res);
    return res;
  } catch (e) {
    toast((e && e.message) || String(e), true);
    return null;
  } finally {
    btn.disabled = false;
    btn.textContent = label;
  }
}

function applyAppData(res) {
  S.config = res.config;
  S.data = res.data;
  if (S.sum.month === res.data.month) S.sum = res.data;
  else S.sumStale = true;
  renderAll();
}

// ───── Render ─────
function renderAll() {
  renderHeader();
  renderSigns();
  renderCategories();
  renderSources();
  renderExpenses();
  renderTransfers();
  renderSummary();
  renderAssets();
}

function renderHeader() {
  $('#h-month').textContent = 'Balance · ' + monthLabel(S.data.month);
  $('#h-balance').textContent = money(S.data.balance);
  $('#h-spent').textContent = money(S.data.totalSpent);
}

function renderSigns() {
  $$('.sign').forEach(b => {
    const form = b.dataset.form, sign = S.sign[form];
    b.textContent = sign < 0 ? '−' : '+';
    b.classList.toggle('plus', sign > 0);
    $('#' + form[0] + '-hint').textContent = SIGN_HINTS[form][sign];
  });
}

function renderCategories() {
  if (S.category && !S.config.categories.some(c => c.name === S.category)) S.category = null;
  $('#e-cats').innerHTML = S.config.categories.map(c =>
    `<button class="chip${c.name === S.category ? ' on' : ''}" data-cat="${esc(c.name)}"><span class="ic">${esc(c.icon || '•')}</span>${esc(c.name)}</button>`
  ).join('');
}

function renderSources() {
  const sel = $('#t-source'), prev = sel.value;
  sel.innerHTML = '<option value="">Chọn nguồn tiền…</option>' +
    S.config.sources.map(s => `<option value="${esc(s.name)}">${esc(s.name)}</option>`).join('');
  if (S.config.sources.some(s => s.name === prev)) sel.value = prev;
  toggleSourceNote();
}

function toggleSourceNote() {
  const src = S.config.sources.find(s => s.name === $('#t-source').value);
  $('#t-source-note').classList.toggle('hidden', !(src && src.requireNote));
}

function dayKey(iso) {
  const d = new Date(iso);
  return isNaN(d) ? '' : d.toLocaleDateString('vi-VN', { weekday: 'short', day: '2-digit', month: '2-digit' });
}
function timeOf(iso) {
  const d = new Date(iso);
  return isNaN(d) ? '' : d.toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit' });
}

function groupedList(rows, kind, rowHtml) {
  if (!rows.length) return '<div class="empty">Chưa có dữ liệu tháng này</div>';
  let last = '', html = '';
  rows.forEach(r => {
    const d = dayKey(r.createdAt);
    if (d !== last) { html += `<div class="day">${esc(d)}</div>`; last = d; }
    html += `<div class="item">${rowHtml(r)}
      <span class="amt num${r.amount > 0 ? ' pos' : ''}">${money(r.amount, true)}</span>
      <button class="del" data-kind="${kind}" data-id="${esc(r.id)}" aria-label="Xoá">×</button></div>`;
  });
  return html;
}

function renderExpenses() {
  const rows = S.data.expenses;
  $('#e-count').textContent = rows.length ? rows.length + ' khoản · ' + money(S.data.totalSpent) : '';
  $('#e-list').innerHTML = groupedList(rows, 'expenses', r => {
    const c = catOf(r.category);
    return `<span class="ic">${esc(c.icon || '•')}</span><div class="main"><div class="t">${esc(r.category)}</div>
      <div class="s">${esc(timeOf(r.createdAt))}${r.note ? ' · ' + esc(r.note) : ''}</div></div>`;
  });
}

function renderTransfers() {
  const rows = S.data.transfers;
  $('#t-total').textContent = rows.length ? money(S.data.totalFlow, true) : '';
  $('#t-list').innerHTML = groupedList(rows, 'transfers', r =>
    `<span class="ic">${r.amount > 0 ? '⬇️' : '⬆️'}</span><div class="main"><div class="t">${esc(r.source)}${r.sourceNote ? ' · ' + esc(r.sourceNote) : ''}</div>
      <div class="s">${esc(timeOf(r.createdAt))}${r.note ? ' · ' + esc(r.note) : ''}</div></div>`);
}

function renderSummary() {
  const d = S.sum;
  $('#s-month').textContent = monthLabel(d.month);
  $('#s-stats').innerHTML = [
    ['Balance tháng trước', money(d.prevBalance)],
    ['Tổng chi', money(d.totalSpent)],
    ['Tiền lưu động', money(d.totalFlow, true)],
    ['Balance cuối tháng', money(d.balance), 'hero'],
  ].map(([k, v, cls]) => `<div class="stat ${cls || ''}"><div class="k">${k}</div><div class="v num">${v}</div></div>`).join('');

  $$('#s-mode button').forEach(b => b.classList.toggle('on', b.dataset.mode === S.chart));

  const spend = d.byCategory.filter(x => x.amount > 0).sort((a, b) => b.amount - a.amount);
  const refunds = d.byCategory.filter(x => x.amount < 0);
  const total = spend.reduce((t, x) => t + x.amount, 0);
  const refundNote = refunds.length
    ? `<p class="note">Hoàn tiền nhiều hơn chi: ${refunds.map(x => esc(x.category) + ' ' + money(x.amount, true)).join(', ')}</p>` : '';

  if (!total) { $('#s-chart').innerHTML = '<div class="empty">Chưa có khoản chi trong tháng</div>' + refundNote; return; }
  $('#s-chart').innerHTML = (S.chart === 'pie' ? pieChart(spend, total) : barChart(spend, total)) + refundNote;
}

/** Donut: danh mục < 3% gộp vào “Còn lại” để các lát nhỏ không bị đè nhau. */
function pieChart(spend, total) {
  const big = spend.filter(x => x.amount / total >= 0.03);
  const small = spend.filter(x => x.amount / total < 0.03);
  const items = big.map(x => { const c = catOf(x.category); return { name: x.category, icon: c.icon, color: colorOf(c.color), amount: x.amount }; });
  if (small.length === 1) {
    const c = catOf(small[0].category);
    items.push({ name: small[0].category, icon: c.icon, color: colorOf(c.color), amount: small[0].amount });
  } else if (small.length) {
    items.push({ name: 'Còn lại (' + small.length + ' mục)', icon: '', color: 'var(--other)', amount: small.reduce((t, x) => t + x.amount, 0) });
  }
  S.pieItems = items;
  S.pieTotal = total;

  const gap = items.length > 1 ? 0.9 : 0;
  let offset = 0;
  const segs = items.map((it, i) => {
    const p = it.amount / total * 100, len = Math.max(p - gap, 0.2);
    const seg = `<circle class="s" data-i="${i}" r="15.9155" cx="21" cy="21" fill="none" stroke="${it.color}" stroke-width="6"
      stroke-dasharray="${len} ${100 - len}" stroke-dashoffset="${-offset}"><title>${esc(it.name)}: ${money(it.amount)}</title></circle>`;
    offset += p;
    return seg;
  }).join('');

  const legend = items.map((it, i) => `<div class="row" data-i="${i}"><span class="sw" style="background:${it.color}"></span>
    <span class="n">${esc(it.icon ? it.icon + ' ' : '')}${esc(it.name)}</span>
    <span class="p num">${Math.round(it.amount / total * 100)}%</span><span class="a num">${money(it.amount)}</span></div>`).join('');

  return `<div class="donut"><svg viewBox="0 0 42 42">${segs}</svg><div class="donut-center" id="dc">${centerHtml(null)}</div></div>
    <div class="legend">${legend}</div>`;
}

function centerHtml(i) {
  if (i == null || !S.pieItems[i]) return `<div class="k">Tổng chi</div><div class="v num">${money(S.pieTotal)}</div>`;
  const it = S.pieItems[i];
  return `<div class="k">${esc(it.name)} · ${Math.round(it.amount / S.pieTotal * 100)}%</div><div class="v num">${money(it.amount)}</div>`;
}

function highlight(i) {
  S.hl = S.hl === i ? null : i;
  $$('#s-chart [data-i]').forEach(el => el.classList.toggle('hl', S.hl !== null && +el.dataset.i === S.hl));
  const dc = $('#dc'); if (dc) dc.innerHTML = centerHtml(S.hl);
}

function barChart(spend, total) {
  const max = spend[0].amount;
  return '<div class="bars">' + spend.map(x => {
    const c = catOf(x.category);
    return `<div class="row"><div class="top"><span>${esc(c.icon ? c.icon + ' ' : '')}${esc(x.category)}</span>
      <span class="a num">${money(x.amount)}<span class="p">${Math.round(x.amount / total * 100)}%</span></span></div>
      <div class="track"><div class="bar" style="width:${(x.amount / max * 100).toFixed(1)}%"></div></div></div>`;
  }).join('') + '</div>';
}

function renderAssets() {
  $('#a-month').textContent = 'đến hết ' + monthLabel(S.data.month).toLowerCase();
  const list = S.data.assets;
  if (!list.length) { $('#a-list').innerHTML = '<div class="empty">Chưa có tài sản nào được theo dõi</div>'; return; }
  const total = list.reduce((t, a) => t + a.balance, 0);
  $('#a-list').innerHTML = list.map(a => `<div class="asset"><div><div>${esc(a.name)}</div>
      <div class="ch num">${a.changeThisMonth ? 'Tháng này ' + money(a.changeThisMonth, true) : 'Tháng này không đổi'}</div></div>
      <div class="b num">${money(a.balance)}</div></div>`).join('') +
    `<div class="asset"><b>Tổng</b><div class="b num">${money(total)}</div></div>`;
}

// ───── Actions ─────
async function saveExpense() {
  const amount = readAmount($('#e-amount'));
  if (!amount) { toast('Nhập số tiền', true); return $('#e-amount').focus(); }
  if (!S.category) return toast('Chọn danh mục', true);
  const ok = await run($('#e-save'), 'Đang lưu…', 'addExpense', {
    category: S.category, amount: amount * S.sign.expense, note: $('#e-note').value,
  });
  if (!ok) return;
  $('#e-amount').value = ''; $('#e-note').value = '';
  toast('Đã lưu ' + money(amount * S.sign.expense, true) + ' · ' + S.category);
}

async function saveTransfer() {
  const amount = readAmount($('#t-amount'));
  const source = $('#t-source').value;
  const src = S.config.sources.find(s => s.name === source);
  if (!amount) { toast('Nhập số tiền', true); return $('#t-amount').focus(); }
  if (!src) return toast('Chọn nguồn tiền', true);
  if (src.requireNote && !$('#t-source-note').value.trim()) { toast('Nguồn “' + source + '” cần ghi chú', true); return $('#t-source-note').focus(); }
  const ok = await run($('#t-save'), 'Đang lưu…', 'addTransfer', {
    source, sourceNote: src.requireNote ? $('#t-source-note').value : '', amount: amount * S.sign.transfer, note: $('#t-note').value,
  });
  if (!ok) return;
  $('#t-amount').value = ''; $('#t-note').value = ''; $('#t-source-note').value = '';
  toast('Đã lưu ' + money(amount * S.sign.transfer, true) + ' · ' + source);
}

let armTimer;
async function onDelete(btn) {
  if (!btn.classList.contains('armed')) {
    $$('.del.armed').forEach(b => { b.classList.remove('armed'); b.textContent = '×'; });
    btn.classList.add('armed'); btn.textContent = 'Xoá?';
    clearTimeout(armTimer);
    armTimer = setTimeout(() => { btn.classList.remove('armed'); btn.textContent = '×'; }, 3000);
    return;
  }
  clearTimeout(armTimer);
  if (await run(btn, '…', 'deleteEntry', btn.dataset.kind, btn.dataset.id)) toast('Đã xoá');
}

async function loadSummary(month) {
  S.sum = Object.assign({}, S.sum, { month });
  $('#s-month').textContent = monthLabel(month);
  $('#s-chart').innerHTML = '<div class="empty">Đang tải…</div>';
  try {
    const d = await api('getMonthData', month);
    if (d.month !== S.sum.month) return;          // người dùng đã chuyển tháng khác
    S.sum = d; S.sumStale = false; S.hl = null;
    renderSummary();
  } catch (e) { toast((e && e.message) || String(e), true); }
}

function showView(name) {
  $$('.view').forEach(v => v.classList.toggle('active', v.id === 'v-' + name));
  $$('nav button').forEach(b => b.classList.toggle('on', b.dataset.view === name));
  window.scrollTo(0, 0);
  if (name === 'summary' && S.sumStale) loadSummary(S.sum.month);
}

// ───── Events ─────
document.addEventListener('click', e => {
  const t = e.target.closest('button, [data-i]');
  if (!t) return;
  if (t.dataset.view) return showView(t.dataset.view);
  if (t.dataset.cat) { S.category = t.dataset.cat; return renderCategories(); }
  if (t.dataset.form) { S.sign[t.dataset.form] *= -1; return renderSigns(); }
  if (t.dataset.target) {
    const el = $('#' + t.dataset.target), n = readAmount(el);
    if (n) el.value = fmt(n * 1000);
    return;
  }
  if (t.dataset.kind) return onDelete(t);
  if (t.dataset.shift) return loadSummary(shiftMonth(S.sum.month, +t.dataset.shift));
  if (t.dataset.mode) { S.chart = t.dataset.mode; S.hl = null; writePref('chart', S.chart); return renderSummary(); }
  if (t.dataset.i != null) return highlight(+t.dataset.i);
});

$$('.amount').forEach(el => el.addEventListener('input', () => {
  const n = readAmount(el);
  el.value = n ? fmt(n) : '';
}));
$('#e-save').addEventListener('click', saveExpense);
$('#t-save').addEventListener('click', saveTransfer);
$('#t-source').addEventListener('change', toggleSourceNote);
['#e-note', '#e-amount'].forEach(s => $(s).addEventListener('keydown', e => { if (e.key === 'Enter') saveExpense(); }));
['#t-note', '#t-amount', '#t-source-note'].forEach(s => $(s).addEventListener('keydown', e => { if (e.key === 'Enter') saveTransfer(); }));
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', renderSummary);

renderAll();
</script>
</body>
</html>
